name: Deploy invitation to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript
        run: |
          node --check config.js
          node --check app.js
          node --check photo-core.js
          node --check photo-submit.js
          node --check random.js
          node scripts/build-memes.mjs
          node --test tests/*.test.cjs
      - name: Prepare public files
        run: |
          mkdir _site
          cp index.html random.html styles.css app.js config.js photo-core.js photo-submit.js random.js _site/
          cp -R assets _site/assets
          cp -R memes _site/memes
          cp -R music _site/music
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
