name: Set up photo backend
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photo-backend
  cancel-in-progress: false
jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      PHOTO_ADMIN_UID: ${{ vars.PHOTO_ADMIN_UID }}
      ALLOWED_ORIGINS: ${{ vars.PHOTO_ALLOWED_ORIGINS }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing secret SUPABASE_ACCESS_TOKEN'; exit 1; }
          test -n "$ALLOWED_ORIGINS" || { echo 'Missing variable PHOTO_ALLOWED_ORIGINS'; exit 1; }
      - name: Set up database and private bucket
        run: node scripts/setup-photo-backend.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Configure accepted website origins
        run: supabase secrets set "ALLOWED_ORIGINS=$ALLOWED_ORIGINS" --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy submission endpoint
        run: supabase functions deploy submit-photo-idea --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
